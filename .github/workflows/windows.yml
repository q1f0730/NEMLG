name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --target x86_64-pc-windows-msvc
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: GlassDock-Windows
          path: |
            target/x86_64-pc-windows-msvc/release/glassdock.exe
            README.txt
