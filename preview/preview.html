 const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bg); gl.generateMipmap(gl.TEXTURE_2D);

 document.getElementById('gl').style.background='url('+bg.toDataURL()+')';

 const U=n=>gl.getUniformLocation(pr,n); const s=1, m=30;
